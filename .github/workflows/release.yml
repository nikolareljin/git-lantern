name: release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver version to release, no leading 'v' (e.g. 0.8.0 or 0.8.0-rc1)"
        required: true
        type: string
      publish_homebrew_only:
        description: "Publish the Homebrew formula without recreating the GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate_release_tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}
    steps:
      - id: release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  github-release:
    # Create the GitHub Release for the tag, using CHANGELOG notes when present
    # and falling back to GitHub auto-generated notes otherwise. Dispatched by
    # auto-tag.yml after a release/x.y.z -> main merge (which always supplies
    # release_tag), or runnable manually with an explicit tag.
    needs: validate_release_tag
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_homebrew_only }}
    uses: nikolareljin/ci-helpers/.github/workflows/create-github-release.yml@production
    with:
      release_tag: ${{ needs.validate_release_tag.outputs.release_tag }}

  homebrew:
    needs: [validate_release_tag, github-release]
    if: ${{ always() && needs.validate_release_tag.result == 'success' && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.validate_release_tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]

      - name: Generate Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lantern-${RELEASE_TAG}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          archive_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          python3 - "$RUNNER_TEMP/git-lantern.rb" "$RELEASE_TAG" "$archive_sha" <<'PY'
          import sys

          path, version, archive_sha = sys.argv[1:]
          formula = f'''# typed: strict
          # frozen_string_literal: true

          # git-lantern: local and GitHub repository visibility and status toolkit.
          class GitLantern < Formula
            include Language::Python::Virtualenv

            desc "Local and GitHub repository visibility and status toolkit"
            homepage "https://github.com/nikolareljin/git-lantern"
            url "https://github.com/nikolareljin/git-lantern/archive/refs/tags/{version}.tar.gz"
            sha256 "{archive_sha}"
            license "MIT"

            depends_on "python@3.12"

            resource "argcomplete" do
              url "https://files.pythonhosted.org/packages/87/6f/5a73f04007ca950701765949209f068da628bd11f9c2da287278ce91e0ee/argcomplete-3.7.2.tar.gz"
              sha256 "aad8b69a0b9969edb62db0d1752354c0d50717b10e0cbb00e2a958381b9fc6b9"
            end

            def install
              virtualenv_install_with_resources
            end

            test do
              system bin/"lantern", "--help"
            end
          end
          '''
          open(path, "w").write(formula)
          PY

      - name: Validate generated formula
        shell: bash
        run: |
          set -euo pipefail
          brew style "$RUNNER_TEMP/git-lantern.rb"
          brew tap-new local/tap
          tap_path="$(brew --repository)/Library/Taps/local/homebrew-tap/Formula"
          cp "$RUNNER_TEMP/git-lantern.rb" "$tap_path/git-lantern.rb"
          brew install --build-from-source local/tap/git-lantern
          brew test local/tap/git-lantern
          lantern --help

      - name: Upload formula for the tap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: homebrew-formula-git-lantern
          path: ${{ runner.temp }}/git-lantern.rb
          if-no-files-found: error

  # Commits the formula to the tap with its deploy key; the tap's ruleset lets
  # that key, and only it, push to main.
  homebrew-publish:
    needs: [validate_release_tag, homebrew]
    uses: nikolareljin/ci-helpers/.github/workflows/homebrew-tap-publish.yml@production
    with:
      formula_artifact: homebrew-formula-git-lantern
      formula_file: git-lantern.rb
      commit_message: "git-lantern ${{ needs.validate_release_tag.outputs.release_tag }}"
    secrets:
      tap_repo: ${{ secrets.HOMEBREW_TAP_REPO }}
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
