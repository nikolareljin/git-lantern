name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source archive, wheel and development installation
        run: python scripts/check_package.py

  python:
    uses: nikolareljin/ci-helpers/.github/workflows/python.yml@production
    with:
      working_directory: "."
      lint_command: "./scripts/lint.sh"
      test_command: "./scripts/test.sh"
      build_command: "./scripts/build.sh"

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Lint and test
        run: |
          set -euo pipefail
          ./scripts/build.sh
          ./scripts/lint.sh
          ./scripts/test.sh
      - name: Install and synchronize a disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/git-lantern-macos"
          prefix="$fixture/opt/git-lantern"
          bin_dir="$fixture/bin"
          remote="$fixture/remote.git"
          seed="$fixture/seed"
          workspace="$fixture/workspace"
          mkdir -p "$fixture" "$workspace"
          ./install --prefix "$prefix" --bin-link "$bin_dir/lantern"
          "$bin_dir/lantern" --version
          git init --bare "$remote"
          git -C "$remote" symbolic-ref HEAD refs/heads/main
          git init -b main "$seed"
          git -C "$seed" config user.name "CI Test"
          git -C "$seed" config user.email "ci@example.invalid"
          git -C "$seed" remote add origin "$remote"
          printf 'first\n' > "$seed/status.txt"
          git -C "$seed" add status.txt
          git -C "$seed" commit -m "seed"
          git -C "$seed" push -u origin main
          git clone "$remote" "$workspace/demo"
          printf 'second\n' >> "$seed/status.txt"
          git -C "$seed" commit -am "advance"
          git -C "$seed" push
          "$bin_dir/lantern" sync --root "$workspace" --pull --only-clean --only-upstream
          test "$(git -C "$workspace/demo" rev-parse HEAD)" = "$(git -C "$seed" rev-parse HEAD)"

  # lantern hooks on Windows: setup-hooks.sh runs under Git Bash, found the way
  # setup-hooks.ps1 finds it.
  windows-hooks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: lantern hooks tests
        shell: pwsh
        run: |
          python -m pip install --quiet pytest
          $env:PYTHONPATH = "src"
          python -m pytest -q tests/test_hooks_cmd.py
      # TODO files come from any OS: CRLF, path case and symlinks differ here.
      - name: lantern todo parsing tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q tests/test_todo_markdown.py tests/test_tui_todo_path.py
      # .env trust compares paths with normcase and realpath, which differ here.
      - name: lantern .env loading tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q tests/test_load_dotenv.py
