[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-lantern"
dynamic = ["version"]
description = "Local and GitHub repository visibility and status toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "git-lantern contributors" }
]
dependencies = ["argcomplete>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.8", "build>=1.2.2"]
docs = ["mkdocs-material>=9.7.7,<10"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]
