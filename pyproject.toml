[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "git-lantern"
dynamic = ["version"]
description = "Local and GitHub repository visibility and status toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "git-lantern contributors" }
]
dependencies = ["argcomplete>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.8", "build>=1.2.2"]
docs = ["mkdocs-material>=9.7.7,<10"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>[^\s]+)'

[tool.hatch.build.targets.wheel]
packages = ["src/lantern"]

[tool.hatch.build.targets.sdist]
only-include = ["src/lantern", "VERSION", "README.md", "pyproject.toml"]
